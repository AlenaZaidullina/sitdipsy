<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Согласие на обработку персональных данных</title>
    <style>
        body {
            font-family: 'Inter Tight', sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
            color: #333;
            background-color: #f8f9fa;
        }
        .consent-container {
            background: white;
            padding: 2.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #76805D;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
        }
        .consent-text {
            margin-bottom: 2rem;
            padding: 1.5rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            background-color: #f8f9fa;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.95rem;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-input {
            width: 100%;
            padding: 1rem;  /* ← Увеличили отступы поля ввода */
            border: 1px solid #DDC5A9;
            border-radius: 4px;
            font-family: 'Inter Tight', sans-serif;
            font-size: 1rem;
        }
        .form-input:focus {
            outline: none;
            border-color: #76805D;
            box-shadow: 0 0 0 2px rgba(118, 128, 93, 0.2);
        }
        .btn {
            padding: 1.2rem 2.5rem;
            background-color: #76805D;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-family: 'Inter Tight', sans-serif;
            font-size: 1.1rem;
            width: 100%;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #5a6347;
        }
        .alert {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="consent-container">
        <h1>Согласие на обработку персональных данных</h1>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <div class="consent-text">
            {% include 'appointment_app/consent_text.html' %}
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="full_name">Введите ваше ФИО для подтверждения согласия:</label>
                <input type="text" class="form-input" id="full_name" name="full_name"
                       placeholder="Иванов Иван Иванович" required autocomplete="name">
            </div>

            <button type="submit" class="btn">Подтвердить согласие</button>
        </form>

        <p style="margin-top: 1rem; text-align: center; color: #666;">
            После подтверждения вы будете перенаправлены на страницу записи на консультацию
        </p>
    </div>
</body>
</html>
